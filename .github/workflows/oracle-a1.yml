name: ConcertMC Oracle A1 Auto Retry

on:

  schedule:

    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: concertmc-oracle-a1
  cancel-in-progress: false

jobs:
  create-a1:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELE_CHAT_ID: ${{ secrets.TELE_CHAT_ID }}

    steps:
      - name: Install Oracle Python SDK & Requests
        run: |
          python -m pip install --quiet "oci>=2.130,<3" requests

      - name: Check and launch ConcertMC A1
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          import tempfile
          import oci
          import requests
          from datetime import datetime

          def send_telegram(message):
              token = os.environ.get("TELEGRAM_BOT_TOKEN")
              chat_id = os.environ.get("TELE_CHAT_ID")
              if token and chat_id:
                  url = f"https://api.telegram.org/bot{token}/sendMessage"
                  payload = {
                      "chat_id": chat_id,
                      "text": message,
                      "parse_mode": "Markdown"
                  }
                  try:
                      requests.post(url, json=payload, timeout=10)
                      print("Telegram notification sent successfully!", flush=True)
                  except Exception as e:
                      print(f"Failed to send Telegram notification: {e}", flush=True)

          compartment = os.environ["OCI_TENANCY_OCID"]
          region = os.environ["OCI_REGION"]
          name = "ConcertMC-A1"

          ad = "dcwi:AP-OSAKA-1-AD-1"

          subnet = (
              "ocid1.subnet.oc1.ap-osaka-1."
              "aaaaaaaalm2p2cgtazbs2g3pfn4vbwpjopm5zd47ppdxhrhcgcgfajnej2ta"
          )

          image = (
              "ocid1.image.oc1.ap-osaka-1."
              "aaaaaaaauk2tyjjxtmfuymyrhiyxxentmj3ykig3zn6zso3266tp6afkxzwa"
          )

          private_key = os.environ["OCI_PRIVATE_KEY"]
          ssh_key = os.environ["OCI_SSH_PUBLIC_KEY"].strip()

          if not ssh_key.startswith(("ssh-rsa ", "ssh-ed25519 ")):
              sys.exit("ERROR: Invalid SSH public key")

          # Create temporary Oracle API key file
          with tempfile.NamedTemporaryFile(
              mode="w",
              delete=False
          ) as f:
              key_path = f.name
              f.write(private_key)
              if not private_key.endswith("\n"):
                  f.write("\n")

          os.chmod(key_path, 0o600)

          try:
              config = {
                  "user": os.environ["OCI_USER_OCID"],
                  "tenancy": os.environ["OCI_TENANCY_OCID"],
                  "fingerprint": os.environ["OCI_FINGERPRINT"],
                  "key_file": key_path,
                  "region": region
              }

              signer = oci.signer.Signer(
                  tenancy=config["tenancy"],
                  user=config["user"],
                  fingerprint=config["fingerprint"],
                  private_key_file_location=key_path
              )

              client = oci.core.ComputeClient(
                  config,
                  signer=signer
              )

              print("Checking existing Oracle instances...", flush=True)

              instances = oci.pagination.list_call_get_all_results(
                  client.list_instances,
                  compartment_id=compartment
              ).data

              # Prevent duplicate ConcertMC instances
              for instance in instances:
                  if (
                      instance.display_name == name
                      and instance.lifecycle_state != "TERMINATED"
                  ):
                      print(
                          "ALREADY EXISTS:",
                          instance.id,
                          instance.lifecycle_state
                      )
                      print("No new instance will be created.")
                      sys.exit(0)

              # Stop if another active A1 instance exists
              for instance in instances:
                  if (
                      instance.shape == "VM.Standard.A1.Flex"
                      and instance.lifecycle_state != "TERMINATED"
                  ):
                      sys.exit(
                          "STOP: Another A1 instance already exists. "
                          "Manual review required."
                      )

              print(
                  "Trying A1: 4 OCPU / 24 GB / 100 GB...",
                  flush=True
              )

              details = oci.core.models.LaunchInstanceDetails(
                  availability_domain=ad,
                  compartment_id=compartment,
                  display_name=name,
                  shape="VM.Standard.A1.Flex",

                  shape_config=oci.core.models.LaunchInstanceShapeConfigDetails(
                      ocpus=4,
                      memory_in_gbs=24
                  ),

                  source_details=oci.core.models.InstanceSourceViaImageDetails(
                      image_id=image,
                      boot_volume_size_in_gbs=100
                  ),

                  create_vnic_details=oci.core.models.CreateVnicDetails(
                      subnet_id=subnet,
                      assign_public_ip=True
                  ),

                  metadata={
                      "ssh_authorized_keys": ssh_key
                  }
              )

              try:
                  response = client.launch_instance(
                      details,
                      retry_strategy=oci.retry.NoneRetryStrategy()
                  )

                  instance_id = response.data.id
                  state = response.data.lifecycle_state

                  print("SUCCESS: Oracle accepted launch request!")
                  print("Instance OCID:", instance_id)
                  print("State:", state)

                  # Gửi thông báo khi tạo thành công
                  msg = (
                      "🎉 *SĂN THÀNH CÔNG VPS ORACLE A1!*\n\n"
                      f"📌 *Name:* `{name}`\n"
                      f"⚡ *State:* `{state}`\n"
                      f"🆔 *Instance ID:* `{instance_id}`\n"
                      "💻 *Cấu hình:* 4 OCPU / 24GB RAM / 100GB Disk"
                  )
                  send_telegram(msg)

              except oci.exceptions.ServiceError as error:
                  message = str(error)

                  if (
                      "OutOfHostCapacity" in message
                      or "Out of capacity" in message
                      or "Out of host capacity" in message
                  ):
                      print(
                          "NO CAPACITY: Waiting for next scheduled run."
                      )
                      # Gửi thông báo khi hết tài nguyên
                      send_telegram(
                          "⏳ *Lượt săn VPS Osaka:* Vẫn đang hết tài nguyên (Out"
                          " of HostCapacity). Đang tiếp tục thử lại tự động..."
                      )
                      sys.exit(0)

                  print("ORACLE ERROR:", message)
                  send_telegram(f"❌ *LỖI ORACLE:* `{message}`")
                  sys.exit(1)

          finally:
              os.remove(key_path)
          PY
